name: DeployForge - Build & Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-scan:
    name: Build, Test & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.mod

      - name: Run tests
        working-directory: ./app
        run: go test ./...

      - name: Run vet
        working-directory: ./app
        run: go vet ./...

      - name: Build
        working-directory: ./app
        run: go build -o deployforge-api ./cmd/api

      - name: Build Docker image
        run: docker build -t deployforge:ci ./app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: deployforge:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag deployforge:ci ghcr.io/harmohanjeetkaur/deployforge:latest
          docker tag deployforge:ci ghcr.io/harmohanjeetkaur/deployforge:${{ github.sha }}
          docker push ghcr.io/harmohanjeetkaur/deployforge:latest
          docker push ghcr.io/harmohanjeetkaur/deployforge:${{ github.sha }}
