name: DeployForge - Build & Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-scan:
    name: Build, Test & Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.mod

      - name: Run tests
        working-directory: ./app
        run: go test ./...

      - name: Run vet
        working-directory: ./app
        run: go vet ./...

      - name: Build
        working-directory: ./app
        run: go build -o deployforge-api ./cmd/api

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t deployforge:ci ./app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: deployforge:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/harmohanjeetkaur/deployforge:latest
            ghcr.io/harmohanjeetkaur/deployforge:${{ github.sha }}

  update-helm-tag:
    name: Update Helm Image Tag
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Helm image tag
        run: |
          CURRENT_TAG=$(grep 'tag:' helm/deployforge/values.yaml | awk '{print $2}' | tr -d '"')
          NEW_TAG="${{ github.sha }}"
          if [ "$CURRENT_TAG" = "$NEW_TAG" ]; then
            echo "Tag already matches $NEW_TAG, skipping commit"
            exit 0
          fi
          sed -i "s/tag: .*/tag: \"$NEW_TAG\"/" helm/deployforge/values.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/deployforge/values.yaml
          git diff --staged --quiet || (git commit -m "ci: update Helm image tag [skip ci]" && git push)
