name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod

      - name: Run tests
        working-directory: ./app
        run: go test ./...

      - name: Run vet
        working-directory: ./app
        run: go vet ./...

      - name: Build
        working-directory: ./app
        run: go build -o deployforge-api ./cmd/api
