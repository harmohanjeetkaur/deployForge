job_name: demo-incident-probes
metrics_path: /probe
params:
  module: [http_2xx]
static_configs:
  - targets: [http://deployforge-readiness-demo.deployforge-gitops.svc.cluster.local:8080/intentionally-unready]
    labels:
      demo: 'true'
      namespace: deployforge-gitops
relabel_configs:
  - source_labels: [__address__]
    target_label: __param_target
  - source_labels: [__param_target]
    target_label: instance
  - target_label: __address__
    replacement: blackbox-exporter:9115
