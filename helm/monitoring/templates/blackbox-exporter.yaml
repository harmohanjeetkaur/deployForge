apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      annotations:
        checksum-config: {{ print (.Files.Get "files/blackbox.yml") | sha256sum }}
      labels:
        app: blackbox-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: blackbox-exporter
        image: prom/blackbox-exporter:v0.29.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9115
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        args:
        - --config.file=/etc/blackbox/blackbox.yml
        volumeMounts:
        - name: config
          mountPath: /etc/blackbox/blackbox.yml
          subPath: blackbox.yml
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: blackbox-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
spec:
  type: ClusterIP
  selector:
    app: blackbox-exporter
  ports:
  - name: http
    port: 9115
    targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
data:
  blackbox.yml: |
{{ tpl (.Files.Get "files/blackbox.yml") . | indent 4 }}
