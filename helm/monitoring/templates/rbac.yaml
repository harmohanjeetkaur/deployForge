apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployforge-monitoring-read
  namespace: deployforge-gitops
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployforge-monitoring-read
  namespace: deployforge-gitops
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: deployforge-monitoring
roleRef:
  kind: Role
  name: deployforge-monitoring-read
  apiGroup: rbac.authorization.k8s.io
