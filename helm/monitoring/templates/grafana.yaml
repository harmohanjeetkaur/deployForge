apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      annotations:
        checksum-config: {{ print (.Files.Get "files/datasource.yml") (.Files.Get "files/provider.yml") (.Files.Get "files/dashboard.json") | sha256sum }}
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: grafana/grafana:12.4.14
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/default.yml
          subPath: datasource.yml
          readOnly: true
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/default.yml
          subPath: provider.yml
          readOnly: true
        - name: config
          mountPath: /var/lib/grafana/dashboards/deployforge.json
          subPath: dashboard.json
          readOnly: true
        - name: data
          mountPath: /var/lib/grafana
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: password
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'false'
        - name: GF_PLUGINS_PREINSTALL_DISABLED
          value: "true"
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: 'false'
      volumes:
      - name: config
        configMap:
          name: grafana-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
data:
  datasource.yml: |
{{ tpl (.Files.Get "files/datasource.yml") . | indent 4 }}
  provider.yml: |
{{ tpl (.Files.Get "files/provider.yml") . | indent 4 }}
  dashboard.json: |
{{ (.Files.Get "files/dashboard.json") | indent 4 }}
