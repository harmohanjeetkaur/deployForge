
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployforge-api
  labels:
    app: deployforge-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deployforge-api
  template:
    metadata:
      labels:
        app: deployforge-api
    spec:
      containers:
        - name: deployforge
          image: deployforge:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
